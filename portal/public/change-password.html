<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set a new password · TrendAI Demo Platform</title>
  <link rel="icon" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/ui/trendai.css" />
</head>
<body>
  <main class="auth">
    <div class="auth-box">
      <div class="auth-head">
        <span class="brand-mark">AI</span>
        <h1 style="font-size:24px">Set a new password</h1>
        <p class="lead">The default password must be changed before the platform unlocks.</p>
      </div>
      <form class="auth-card" id="changeForm" autocomplete="off">
        <label class="field">Current password
          <input type="password" id="current" autocomplete="current-password" required />
        </label>
        <label class="field">New password <span class="hint">At least 8 characters</span>
          <input type="password" id="newpw" autocomplete="new-password" minlength="8" required />
        </label>
        <label class="field">Confirm new password
          <input type="password" id="confirm" autocomplete="new-password" minlength="8" required />
        </label>
        <button class="btn primary" type="submit" id="submitBtn">Update password</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>
    </div>
  </main>
  <script>
    const form = document.getElementById('changeForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg'; msg.textContent = '';
      const current = document.getElementById('current').value;
      const newpw = document.getElementById('newpw').value;
      const confirm = document.getElementById('confirm').value;
      if (newpw.length < 8) { msg.className = 'msg error'; msg.textContent = 'New password must be at least 8 characters.'; return; }
      if (newpw !== confirm) { msg.className = 'msg error'; msg.textContent = 'New password and confirmation do not match.'; return; }
      btn.disabled = true;
      try {
        const res = await fetch('/api/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword: current, newPassword: newpw }),
        });
        const data = await res.json();
        if (!res.ok) { msg.className = 'msg error'; msg.textContent = data.error || 'Could not update the password.'; btn.disabled = false; return; }
        msg.className = 'msg ok'; msg.textContent = 'Password updated. Opening the platform…';
        setTimeout(() => (window.location.href = '/'), 800);
      } catch (_) {
        msg.className = 'msg error'; msg.textContent = 'Network error. Please try again.'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
