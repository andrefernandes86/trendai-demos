<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home · TrendAI Demo Platform</title>
  <link rel="icon" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/ui/trendai.css" />
</head>
<body data-page="home">
  <div class="shell">
    <aside class="side" id="side" aria-label="Platform navigation"></aside>
    <main class="main">
      <header class="page-head">
        <div>
          <span class="eyebrow">Workspace</span>
          <h1>Demo hub</h1>
          <p class="lead">Launch a demo, check what it is connected to, and see what happened across every tool.</p>
        </div>
        <div class="actions">
          <a class="chip lg" id="healthChip" href="/system"><span class="dot off"></span>Checking services…</a>
          <a class="btn primary" href="/connections"><span id="plugIco"></span>Connections</a>
        </div>
      </header>

      <section class="section" aria-labelledby="conn-h">
        <div class="section-head"><h2 id="conn-h">Connections</h2><span class="muted small">Set once, used by every tool</span></div>
        <div class="grid" id="connGrid"></div>
      </section>

      <section class="section" aria-labelledby="demo-h">
        <div class="section-head"><h2 id="demo-h">Demo tools</h2><span class="muted small" id="demoCount"></span></div>
        <div class="grid wide" id="demoGrid"></div>
      </section>

      <div class="row">
        <section class="section" aria-labelledby="other-h" style="flex:1 1 320px">
          <h2 id="other-h">Business tools &amp; other</h2>
          <div id="otherList" class="section"></div>
        </section>
        <section class="section" aria-labelledby="act-h" style="flex:2 1 480px">
          <div class="section-head"><h2 id="act-h">Recent activity</h2><a class="small" href="/activity" style="text-decoration:none">View all →</a></div>
          <div class="card tight" id="recent"><div class="empty">Loading…</div></div>
        </section>
      </div>
    </main>
  </div>

  <script src="/demos.js"></script>
  <script src="/ui/shell.js"></script>
  <script>
    (async () => {
      const { esc, icon, api, fmtTime } = TA;
      if (!(await TA.boot())) return;
      document.getElementById('plugIco').innerHTML = icon('plug');

      const USE_LABEL = { visionOne: 'Vision One', aiGuard: 'AI Guard', fileSecurity: 'File Security', llm: 'LLM', 'llm-per-scan': 'LLM · per scan' };
      let conn = null, health = null;

      function statusFor(d) {
        const s = health && health.services.find((x) => x.id === d.svc);
        if (!s) return '<span class="status off"><span class="dot off"></span>Unknown</span>';
        if (s.status === 'healthy') return '<span class="status ok"><span class="dot"></span>Running</span>';
        return `<span class="status bad"><span class="dot bad"></span>${esc(s.status)}</span>`;
      }
      function llmName(svc) {
        if (!conn) return 'LLM';
        const id = conn.llm.assignments[svc] || conn.llm.defaultId;
        const ep = conn.llm.endpoints.find((e) => e.id === id);
        return ep ? `LLM · ${ep.name}` : 'LLM';
      }
      function useChips(d) {
        return (d.uses || []).map((u) => u.startsWith('llm')
          ? `<span class="chip violet">${esc(u === 'llm' ? llmName(d.svc) : USE_LABEL[u])}</span>`
          : `<span class="chip">${esc(USE_LABEL[u] || u)}</span>`).join('')
          + (d.svc === 'aitarget' ? '<span class="chip warn">:8090 lab only</span>' : '');
      }

      function renderTools() {
        const all = TA.demos();
        const demo = all.filter((d) => d.category === 'Demo Tools');
        document.getElementById('demoCount').textContent = `${demo.length} tools · each opens inside this shell`;
        document.getElementById('demoGrid').innerHTML = demo.map((d) => `
          <article class="card tool-card${d.svc === 'aitarget' ? ' glow' : ''}">
            <div class="top"><span class="tile-icon">${icon(d.icon, 20)}</span>
              <div style="min-width:0"><div class="title">${esc(d.short || d.title)}</div><div class="muted small">${esc((d.subtitle || '').replace(/^Use Case · /, ''))}</div></div></div>
            <p>${esc(d.desc)}</p>
            <div class="chips">${useChips(d)}</div>
            ${d.steps && d.steps.length ? `<details><summary>How to demo</summary><ol>${d.steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}</details>` : ''}
            <div class="foot">${statusFor(d)}<a class="link-btn" href="/tool/${esc(d.id)}">Open →</a></div>
          </article>`).join('');
        document.getElementById('otherList').innerHTML = all.filter((d) => d.category !== 'Demo Tools').map((d) => `
          <article class="card" style="flex-direction:row;align-items:center;gap:12px;padding:16px">
            <span class="tile-icon violet">${icon(d.icon, 20)}</span>
            <div style="flex:1;min-width:0"><div style="font-weight:600">${esc(d.short || d.title)}</div><div class="muted small">${esc(d.subtitle || '')}</div></div>
            <a class="link-btn" href="/tool/${esc(d.id)}">Open →</a>
          </article>`).join('');
      }

      function renderConn() {
        const v = conn.visionOne, ag = conn.aiGuard, fs = conn.fileSecurity;
        const def = conn.llm.endpoints.find((e) => e.id === conn.llm.defaultId) || {};
        const region = conn.meta.regions[v.region] || {};
        const keyState = (own, from) => own ? 'Connected' : (from === 'visionOne' ? 'Vision One key' : 'Not set');
        const cls = (txt) => txt === 'Not set' ? 'bad' : 'ok';
        const cards = [
          ['TrendAI Vision One', v.apiKeySet ? 'Connected' : 'Not set', `${region.label || v.region} · ${(region.api || '').replace('https://', '')}`, v.apiKeySet ? `key ${v.apiKeyHint}` : 'Add an API key'],
          ['AI Guard', keyState(ag.apiKeySet, conn.effective.aiGuardKeyFrom), `${ag.maxKb} KB chunks · ${ag.failClosed ? 'fail closed' : 'fail open'}`, ag.apiKeySet ? `key ${ag.apiKeyHint}` : (conn.effective.aiGuardKeyFrom === 'visionOne' ? 'uses the Vision One key' : 'Add an API key')],
          ['File Security', keyState(fs.apiKeySet, conn.effective.fileSecurityKeyFrom), `${fs.region} · PML ${fs.pml ? 'on' : 'off'}`, fs.apiKeySet ? `key ${fs.apiKeyHint}` : (conn.effective.fileSecurityKeyFrom === 'visionOne' ? 'uses the Vision One key' : 'Add an API key')],
          ['Default LLM', def.baseUrl === 'http://ollama:11434' ? 'Bundled' : 'External', `${def.name || ''}${def.model ? ' · ' + def.model : ''}`, def.baseUrl || ''],
        ];
        document.getElementById('connGrid').innerHTML = cards.map(([k, st, v1, v2], i) => `
          <a class="card${i === 3 ? ' glow' : ''}" href="/connections" style="gap:8px;padding:16px">
            <span style="display:flex;justify-content:space-between;font-size:12px" class="muted"><span>${esc(k)}</span><span class="status ${i === 3 ? 'ok' : cls(st)}" style="font-size:12px">${esc(st)}</span></span>
            <span style="font-size:15px;font-weight:600">${esc(v1)}</span>
            <span class="mono muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v2)}</span>
          </a>`).join('');
      }

      function renderHealth() {
        const chip = document.getElementById('healthChip');
        const svcs = health.services.filter((s) => s.profile !== 'local-llm' || s.status === 'healthy');
        const ok = svcs.filter((s) => s.status === 'healthy').length;
        chip.className = 'chip lg ' + (ok === svcs.length ? 'ok' : 'warn');
        chip.innerHTML = `<span class="dot ${ok === svcs.length ? '' : 'warn'}"></span>${ok} of ${svcs.length} services healthy`;
      }

      function outcomeChip(e) {
        const cls = { blocked: 'bad', finding: 'warn', warn: 'warn', info: 'info' }[e.kind] || 'ok';
        return `<span class="chip ${cls}">${esc(e.outcome)}</span>`;
      }

      renderTools();
      const [c, h, a] = await Promise.allSettled([api('/api/connections'), api('/api/system'), api('/api/activity')]);
      if (c.status === 'fulfilled') { conn = c.value; renderConn(); }
      if (h.status === 'fulfilled') { health = h.value; renderHealth(); }
      renderTools();
      const rec = document.getElementById('recent');
      if (a.status === 'fulfilled' && a.value.events.length) {
        rec.innerHTML = a.value.events.slice(0, 6).map((e) => `<div class="feed-row"><span class="time">${fmtTime(e.ts)}</span><span class="tag">${esc(e.tool)}</span><span class="what">${esc(e.event)}</span>${outcomeChip(e)}</div>`).join('');
      } else {
        rec.innerHTML = '<div class="empty">No activity yet. Open a tool to get started.</div>';
      }
    })();
  </script>
</body>
</html>
