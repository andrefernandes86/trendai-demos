<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · TrendAI Demo Platform</title>
  <link rel="icon" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/ui/trendai.css" />
</head>
<body>
  <main class="auth">
    <div class="auth-box">
      <div class="auth-head">
        <span class="brand-mark">AI</span>
        <h1 style="font-size:24px">TrendAI <span style="color:var(--cyan)">Demo Platform</span></h1>
        <p class="lead">Sign in to open the demo tools.</p>
      </div>
      <form class="auth-card" id="loginForm" autocomplete="off">
        <label class="field">Username
          <input type="text" id="username" name="username" value="admin" autocapitalize="off" spellcheck="false" autocomplete="username" />
        </label>
        <label class="field">Password
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary" type="submit" id="submitBtn">Sign in</button>
        <div class="msg" id="msg" role="alert"></div>
        <p class="muted small" style="margin:0">First time here? The default credentials are <b>admin / admin</b>; you'll be asked to set a new password.</p>
      </form>
      <p class="auth-foot">Internal sales and demo use</p>
    </div>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value }),
        });
        const data = await res.json();
        if (!res.ok) { msg.className = 'msg error'; msg.textContent = data.error || 'Sign-in failed.'; btn.disabled = false; return; }
        window.location.href = data.mustChangePassword ? '/change-password' : '/';
      } catch (_) {
        msg.className = 'msg error'; msg.textContent = 'Network error. Please try again.'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
